spring:
  application:
    name: spring-backend
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/synchro_db
    username: root
    password: password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      # dialect: org.hibernate.dialect.PostgreSQLDialect
      "[format_sql]": true # "[]" because of the special character _ in the key
    show-sql: true
